name: database
services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    environment:
      # ✅ 自定义 root 密码（修改此处即可）
      MARIADB_ROOT_PASSWORD: kGB24PhUmR655WRbzB8vRXUkbdpdkF
      # 可选：同时创建一个普通数据库和用户
      MARIADB_DATABASE: redmine
      MARIADB_USER: remine2026
      MARIADB_PASSWORD: "a8M?]xmmRw<a-bMeXEAZ"
      # 设置时区，避免时间问题
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      # 数据持久化（必须挂载，否则容器删除后数据丢失）
      - ./mariadb_data:/var/lib/mysql
      #  可选：初始化 SQL 脚本目录（首次启动时自动执行）
#      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # 可选：自定义配置文件目录
      # - ./conf.d:/etc/mysql/conf.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
#    healthcheck:
#      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#      start_period: 30s