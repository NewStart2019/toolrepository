input {
  udp {
    port => 514
    type => "tplink-syslog"
    codec => plain { charset => "GB2312" }
  }
}

filter {
  if [log_type] == "tplink-syslog" {
    # ========== 第一步：提取 Syslog PRI 头 ==========
    grok {
      match => { "message" => "<%{INT:syslog_pri}>%{GREEDYDATA:raw_message}" }
      tag_on_failure => ["_grokparsefailure_syslog"]
    }

    # ========== 第二步：解码 Facility 和 Severity ==========
    if [syslog_pri] {
      ruby {
        code => "
          pri = event.get('syslog_pri').to_i
          event.set('syslog_facility', pri / 8)
          event.set('syslog_severity', pri % 8)

          severity_map = {0=>'EMERG',1=>'ALERT',2=>'CRIT',3=>'ERR',4=>'WARNING',5=>'NOTICE',6=>'INFO',7=>'DEBUG'}
          facility_map = {16=>'local0',17=>'local1',18=>'local2',19=>'local3',20=>'local4',21=>'local5',22=>'local6',23=>'local7'}

          event.set('syslog_severity_label', severity_map[event.get('syslog_severity')] || 'UNKNOWN')
          event.set('syslog_facility_label', facility_map[event.get('syslog_facility')] || 'UNKNOWN')
        "
      }
    }

    # ========== 第三步：解析 TP-Link 消息体 ==========
    # R483G V5 典型格式: "Jul  8 09:20:00 TL-R483G: User admin logged in from 192.168.1.100"
    grok {
      match => {
        "raw_message" => "%{SYSLOGTIMESTAMP:timestamp} %{DATA:device_name}:?\s*%{GREEDYDATA:log_content}"
      }
      tag_on_failure => ["_grokparsefailure_tplink"]
    }

    # ========== 第四步：智能分类日志内容 ==========
    if [log_content] {
      # DHCP 分配
      if "DHCP" in [log_content] {
        mutate { add_field => { "log_category" => "DHCP" } }
        grok {
          match => { "log_content" => "DHCP server assigned %{IP:dhcp_ip} to %{MAC:dhcp_mac}" }
          tag_on_failure => []
        }
      }
      # 用户登录/登出
      else if "logged in" in [log_content] or "logged out" in [log_content] {
        mutate { add_field => { "log_category" => "AUTH" } }
        grok {
          match => { "log_content" => "User %{WORD:username} %{WORD:action} from %{IP:source_ip}" }
          tag_on_failure => []
        }
      }
      # NAT/会话
      else if "NAT" in [log_content] or "session" in [log_content] {
        mutate { add_field => { "log_category" => "NAT" } }
      }
      # 攻击防御
      else if "attack" in [log_content] or "DoS" in [log_content] or "SPI" in [log_content] {
        mutate { add_field => { "log_category" => "SECURITY" } }
      }
      # 其他
      else {
        mutate { add_field => { "log_category" => "SYSTEM" } }
      }
    }

    # ========== 第五步：时间处理 & 清理 ==========
    date {
      match => [ "timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
      timezone => "Asia/Shanghai"
    }

    mutate {
      remove_field => [ "raw_message", "timestamp", "host" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "tplink-syslog-%{+YYYY.MM.dd}"
    # 🔐 授权配置
    user => "elastic"
    password => "kibana_system2026"

    # 性能优化（可选但推荐）
    ilm_enabled => false          # 若不使用 ILM 则关闭，避免额外权限需求
    manage_template => true       # 允许 Logstash 管理索引模板
    template_overwrite => true
  }
  # 调试时取消注释，查看解析结果
  stdout { codec => rubydebug }
}