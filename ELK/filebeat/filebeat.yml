# ========== 1. 全局注册表持久化配置（防漏采/重复采集）==========
filebeat:
  registry:
    # 注册表刷盘间隔，默认1s，磁盘压力大可调大
    flush: 1s
    # 注册表文件持久化，关闭内存临时存储
    file_permissions: 0600
    # 保留注册表历史，异常重启可回溯偏移
    cleanup_interval: 60m

# 开启模块目录加载 auditd
#filebeat.config.modules:
#  path: ${path.home}/modules.d/*.yml
#  reload.enabled: false

#===================== 输入源：采集nginx日志  filestream =====================
filebeat.inputs:
  # 采集nginx访问日志
  - type: filestream
    id: nginx-access
    enable: true
    paths:
      - /var/log/nginx/access.log
    # 给日志打标签，区分nginx日志
    tags: ["nginx-access"]
    # 多行合并（nginx日志单行，可不配）
    multiline.type: pattern
    multiline.pattern: '^\[0-9\]{1,3}\.\[0-9\]{1,3}\.\[0-9\]{1,3}\.\[0-9\]{1,3}'
    multiline.negate: true
    multiline.match: after
    ignore_older: 24h
    scan_frequency: 5s

  # 采集nginx错误日志
  - type: filestream
    id: nginx-error
    enable: true
    paths:
      - /var/log/nginx/error.log
    tags: ["nginx-error"]
    ignore_older: 72h

  - type: filestream
    id: auditd
    enabled: true
    paths:
      - /var/log/audit/audit.log
    tags: ["audit-log"]

  # 3. SpringBoot stcjc 应用JSON日志【新增】
  - type: filestream
    id: springboot-stcjc
    enabled: true
    paths:
      - /app/logs/stcjc/**/*.json
    tags: ["springboot-stcjc"]
    # 自动解析单行JSON日志
    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
    ignore_older: 72h
    scan_frequency: 5s
    close_inactive: 5m

# ========== 输出分流：根据标签区分索引 ==========
output.elasticsearch:
  hosts: ["172.16.0.238:9200"]
  username: "elastic"
  password: "kibana_system2026"
  bulk_max_size: 1000

  # 多输出分流规则
  indices:
    # 规则1：audit审计日志 → stcjc-web-audit-日期
    - index: "stcjc-web-audit-%{+YYYY.MM.dd}"
      when.contains:
        tags: "audit-log"
    # springboot应用日志
    - index: "stcjc-web-app-%{+YYYY.MM.dd}"
      when.contains:
        tags: "springboot-stcjc"
    # 规则2：其余nginx日志 → nginx-logs-日期
    - index: "nginx-logs-%{+YYYY.MM.dd}"

# ========== 处理器：时间字段映射 + 字段精简 ==========
processors:
  - drop_fields:
      fields: ["input.type", "log.file.path"]
      ignore_missing: true

#===================== Kibana内置仪表盘自动导入 =====================
setup.kibana:
  host: "http://172.16.0.238:5601"

# 自动加载 nginx内置仪表盘模板
setup.dashboards.enabled: false
setup.template.enabled: false
setup.template.name: "nginx-logs"
setup.template.pattern: "nginx-logs-*"


# 1. 启用 ILM
setup.ilm.enabled: true
# 2. 指定策略名称
setup.ilm.policy_name: "filebeat"
# 4. 启动时覆盖已有策略（默认 false）
setup.ilm.overwrite: true
# 5. 禁用策略存在性检查（不推荐）
setup.ilm.check_exists: true
